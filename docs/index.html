<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ETF 历史回看 · 三因子轮动</title>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2128;--bd:#30363d;--t:#c9d1d9;--td:#8b949e;
  --up:#f85149;--down:#3fb950;--b:#58a6ff;--y:#d29922;--p:#a371f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);padding:16px;max-width:1240px;margin:0 auto;line-height:1.5}
.hd{text-align:center;margin-bottom:14px}
.hd h1{font-size:23px;color:var(--b);font-weight:700;letter-spacing:.5px}
.hd .sub{font-size:12px;color:var(--td);margin-top:6px}
.hd .sub b{color:var(--t)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
/* 控制条 */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;color:var(--td)}
select,input{background:var(--card2);color:var(--t);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
select:focus{border-color:var(--b)}
select{min-width:130px}
.btn{background:var(--card2);color:var(--t);border:1px solid var(--bd);border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--b);color:var(--b)}
.btn.pri{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
.btn.pri:hover{background:#388bfd;color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--td);transition:.15s;user-select:none}
.chip:hover{border-color:var(--b);color:var(--b)}
.chip.on{background:#1f6feb22;border-color:var(--b);color:var(--b)}
/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.kpi .k{font-size:11px;color:var(--td);margin-bottom:6px}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .x{font-size:11px;color:var(--td);margin-top:3px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--td)}
/* 图 */
.chartbox{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 8px 6px;margin-bottom:14px}
.chartbox .ct{font-size:12px;color:var(--td);padding:0 6px 6px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
svg{display:block;width:100%;height:auto}
/* Tab */
.tabs{display:flex;gap:4px;margin-bottom:-1px;overflow-x:auto}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--td);padding:9px 16px;font-size:13px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--card);border-color:var(--bd);color:var(--b);font-weight:600}
.tabbody{background:var(--card);border:1px solid var(--bd);border-radius:0 10px 10px 10px;padding:12px;overflow:hidden}
/* 表 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{color:var(--td);font-weight:500;font-size:11px;padding:8px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;background:var(--card)}
th:first-child,th.l{text-align:left}
td{padding:8px 7px;text-align:right;border-bottom:1px solid #21262d;white-space:nowrap}
td.l{text-align:left}
tr.dr{cursor:pointer}
tr.dr:hover{background:#1c2128}
tr.dr .arw{color:var(--td);font-size:10px;display:inline-block;transition:.15s;width:12px}
tr.dr.open .arw{transform:rotate(90deg);color:var(--b)}
tr.sub td{background:#0f1318;padding:0}
.subbox{padding:10px 8px 14px}
.subhd{font-size:11px;color:var(--td);padding:4px 6px 8px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;line-height:17px}
.tag.bull{background:#f8514922;color:var(--up)}
.tag.neu{background:#d2992222;color:var(--y)}
.tag.bear{background:#3fb95022;color:var(--down)}
.tag.ok{background:#3fb95022;color:var(--down)}
.tag.no{background:#30363d55;color:var(--td)}
.rk{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;border-radius:5px;font-size:11px;background:var(--card2);color:var(--td)}
.rk.r1{background:var(--up);color:#fff;font-weight:700}
.rk.r2{background:#f0883e;color:#fff;font-weight:600}
.rk.r3{background:var(--y);color:#fff;font-weight:600}
.hold{font-weight:600;color:var(--b)}
.mini{color:var(--td);font-size:11px}
.note{background:#1f6feb11;border:1px solid #1f6feb44;border-left:3px solid var(--b);border-radius:8px;padding:11px 13px;font-size:12.5px;color:#a9b4c0;line-height:1.9}
.note b{color:var(--t)}
.act{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;margin-right:4px;font-weight:600}
.act.sell{background:#3fb95025;color:#3fb950}
.act.buy{background:#f8514925;color:#f85149}
.empty{text-align:center;color:var(--td);padding:36px 10px;font-size:13px}
.bar{height:4px;border-radius:2px;background:var(--bd);overflow:hidden;width:52px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--b)}
.ft{text-align:center;color:#484f58;font-size:11px;padding:16px 0 6px;line-height:1.8}
.loading{text-align:center;padding:40px;color:var(--td);font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--b);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:640px){
  body{padding:10px}
  .hd h1{font-size:19px}
  .fld,select{flex:1;min-width:0}
  select{width:100%;min-width:0}
  .ctrl{align-items:stretch}
  .kpi .v{font-size:17px}
}
</style>
</head>
<body>

<div class="hd">
  <h1>📅 ETF 历史回看 · 三因子轮动</h1>
  <div class="sub" id="subinfo">加载中…</div>
</div>

<div class="panel">
  <div class="ctrl">
    <div class="fld"><label>起始日期</label><select id="dStart"></select></div>
    <div class="fld"><label>结束日期</label><select id="dEnd"></select></div>
    <div class="fld"><label>快捷区间</label>
      <div class="quick" id="quick">
        <span class="chip" data-n="5">近5日</span>
        <span class="chip" data-n="10">近10日</span>
        <span class="chip" data-n="20">近20日</span>
        <span class="chip" data-n="60">近60日</span>
        <span class="chip" data-n="0">全部</span>
      </div>
    </div>
    <button class="btn pri" id="btnGo">🔄 重新生成</button>
    <button class="btn" id="btnExp">⬇ 导出本区间</button>
  </div>
</div>

<div class="cards" id="kpis"></div>

<div class="chartbox">
  <div class="ct"><span>每日风控通过数（0-48）· 底色为大盘状态</span><span id="charttip"></span></div>
  <div id="chart"></div>
</div>

<div class="tabs">
  <button class="tab on" data-t="daily">📋 每日概览</button>
  <button class="tab" data-t="rank">🏆 区间 ETF 排行</button>
  <button class="tab" data-t="flip">🔁 推荐切换轨迹</button>
  <button class="tab" data-t="pace">🐢 调仓节奏对比</button>
</div>
<div class="tabbody" id="tabbody"><div class="loading"><span class="spin"></span>加载中…</div></div>

<div class="ft">
  数据每交易日自动更新 4 次（北京时间 08:35 / 11:35 / 15:35 / 20:35）<br>
  ETF-ROTATION-PRO 同口径 · M动量40% + V相对低位30% + F资金流30% + 三重风控 · 红涨绿跌<br>
  历史数据不可改写，仅供复盘参考，不构成投资建议
</div>

<script>
const $ = s => document.querySelector(s);
const cache = {};        // date -> snapshot
let IDX = null, DATES = [], CUR = {start:'', end:''}, TAB = 'daily', BUNDLE = null;
const OPEN = new Set();

const fmt = (v, d=2) => (v==null||isNaN(v)) ? '—' : Number(v).toFixed(d);
const cls = v => v==null ? 'flat' : (v>0 ? 'up' : v<0 ? 'down' : 'flat');
const sgn = (v,d=2) => v==null ? '—' : (v>0?'+':'') + Number(v).toFixed(d) + '%';
const WD = ['日','一','二','三','四','五','六'];
const wd = d => '周' + WD[new Date(d+'T00:00:00').getDay()];
const stTag = s => `<span class="tag ${s==='强势'?'bull':s==='弱势'?'bear':'neu'}">${s||'—'}</span>`;

async function loadDay(d){
  if (cache[d]) return cache[d];
  if (BUNDLE && BUNDLE.days && BUNDLE.days[d]) return (cache[d] = BUNDLE.days[d]);
  try{
    const r = await fetch(`data/${d}.json`, {cache:'no-cache'});
    if(!r.ok) return null;
    cache[d] = await r.json();
    return cache[d];
  }catch(e){ return null; }
}

/* 本地双击(file://)兜底: 浏览器禁止 fetch, 改用脚本注入的 bundle */
function injectJS(src){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

/* ============ 启动 ============ */
(async function boot(){
  try{
    const r = await fetch('data/index.json', {cache:'no-cache'});
    IDX = await r.json();
  }catch(e){
    try{
      await injectJS('data/local-bundle.js');
      BUNDLE = window.__ETF_BUNDLE__ || null;
      if (BUNDLE && BUNDLE.index) IDX = BUNDLE.index;
    }catch(e2){}
  }
  if (!IDX){
    $('#subinfo').textContent = '数据未就绪';
    $('#tabbody').innerHTML = '<div class="empty">本地打开时请先运行 <b>run.bat</b> 生成数据（docs/data 目录为空或 local-bundle.js 缺失）</div>';
    return;
  }
  DATES = Object.keys(IDX.days).sort();          // 升序
  $('#subinfo').innerHTML =
    `数据更新 <b>${IDX.updated}</b> · 覆盖 <b>${IDX.range[0]}</b> ~ <b>${IDX.range[1]}</b> · 共 <b>${IDX.count}</b> 个交易日 · 48 只 ETF`;
  const opts = [...DATES].reverse().map(d=>`<option value="${d}">${d} ${wd(d)}</option>`).join('');
  $('#dStart').innerHTML = opts; $('#dEnd').innerHTML = opts;
  // 支持 URL 参数: ?start=2026-09-01&end=2026-11-10&tab=rank
  const QS = new URLSearchParams(location.search);
  const qs = QS.get('start') || '', qe = QS.get('end') || '', qt = QS.get('tab') || '';
  if (qs && qe && DATES.includes(qs) && DATES.includes(qe)){
    $('#dStart').value = qs; $('#dEnd').value = qe;
    render();
  }else{
    quick(10);
  }
  if (qt) setTab(qt);
})();

function quick(n){
  const end = DATES[DATES.length-1];
  const start = n>0 ? DATES[Math.max(0, DATES.length-n)] : DATES[0];
  $('#dStart').value = start; $('#dEnd').value = end;
  document.querySelectorAll('#quick .chip').forEach(c=>
    c.classList.toggle('on', c.dataset.n === String(n)));
  render();
}

$('#quick').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  quick(Number(c.dataset.n));
});
function setTab(name){
  const t = document.querySelector(`.tab[data-t="${name}"]`);
  if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); TAB = name; OPEN.clear(); drawTab();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>setTab(t.dataset.t));
});
$('#btnGo').addEventListener('click', ()=>{
  document.querySelectorAll('#quick .chip').forEach(c=>c.classList.remove('on'));
  render(true);
});
$('#dStart').addEventListener('change', ()=>render());
$('#dEnd').addEventListener('change', ()=>render());

/* ============ 主渲染 ============ */
async function render(flash){
  let s = $('#dStart').value, e = $('#dEnd').value;
  if (s > e) { [s,e] = [e,s]; $('#dStart').value = s; $('#dEnd').value = e; }
  CUR = {start:s, end:e};
  const range = DATES.filter(d => d >= s && d <= e);
  $('#tabbody').innerHTML = '<div class="loading"><span class="spin"></span>正在按区间生成页面…</div>';
  await Promise.all(range.map(loadDay));
  const snaps = range.map(d=>cache[d]).filter(Boolean);
  drawKPI(snaps);
  drawChart(snaps);
  drawTab();
  if (flash){ $('#btnGo').textContent = '✅ 已生成'; setTimeout(()=>$('#btnGo').textContent='🔄 重新生成', 1200); }
}

function drawKPI(snaps){
  if(!snaps.length){ $('#kpis').innerHTML=''; return; }
  const first = snaps[0], last = snaps[snaps.length-1];
  const idxRet = (first.idx && last.idx) ? (last.idx/first.idx-1)*100 : null;
  const avgPass = snaps.reduce((a,s)=>a+s.pass,0)/snaps.length;
  // 常客: 区间内进入"推荐(前2且风控通过)"次数最多的
  const cnt = {};
  snaps.forEach(s=>{
    const top = s.items.filter(x=>x.pass).slice(0,2);
    top.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);
  });
  const fav = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const strong = snaps.filter(s=>s.st==='强势').length;
  const weak = snaps.filter(s=>s.st==='弱势').length;

  $('#kpis').innerHTML = `
    <div class="kpi"><div class="k">区间交易日</div><div class="v">${snaps.length}</div><div class="x">${first.d} ~ ${last.d}</div></div>
    <div class="kpi"><div class="k">上证区间涨跌</div><div class="v ${cls(idxRet)}">${sgn(idxRet)}</div><div class="x">${fmt(first.idx)} → ${fmt(last.idx)}</div></div>
    <div class="kpi"><div class="k">日均风控通过</div><div class="v">${fmt(avgPass,1)}<span class="mini"> /48</span></div><div class="x">最后一交易日 ${last.pass}</div></div>
    <div class="kpi"><div class="k">最常上榜</div><div class="v" style="font-size:16px">${fav?fav[0]:'—'}</div><div class="x">${fav?fav[1]+' 次进入推荐':'—'}</div></div>
    <div class="kpi"><div class="k">大盘状态分布</div><div class="v" style="font-size:15px"><span class="up">强${strong}</span> · <span style="color:var(--y)">中${snaps.length-strong-weak}</span> · <span class="down">弱${weak}</span></div><div class="x">按交易日计</div></div>`;
}

function drawChart(snaps){
  if(!snaps.length){ $('#chart').innerHTML=''; return; }
  const W=1120, H=190, PL=34, PR=12, PT=14, PB=34;
  const iw=W-PL-PR, ih=H-PT-PB;
  const n=snaps.length;
  const x=i=> n===1 ? PL+iw/2 : PL + iw*i/(n-1);
  const y=v=> PT + ih*(1 - v/48);
  const pts=snaps.map((s,i)=>[x(i),y(s.pass)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)},${PT+ih} L${pts[0][0].toFixed(1)},${PT+ih} Z`;
  let bg='';
  const bw = n===1 ? iw : iw/(n-1);
  snaps.forEach((s,i)=>{
    const c = s.st==='强势'?'#f85149':s.st==='弱势'?'#3fb950':'#d29922';
    bg += `<rect x="${(x(i)-(n===1?iw/2:bw/2)).toFixed(1)}" y="${PT}" width="${Math.max(bw,1.2).toFixed(1)}" height="${ih}" fill="${c}" opacity="0.10"/>`;
  });
  let grid='';
  [0,12,24,36,48].forEach(v=>{
    grid += `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" stroke="#30363d" stroke-width="1" stroke-dasharray="${v?'3,4':'0'}"/>
             <text x="${PL-6}" y="${(y(v)+3.5).toFixed(1)}" fill="#8b949e" font-size="9" text-anchor="end">${v}</text>`;
  });
  const step = Math.max(1, Math.ceil(n/8));
  let xlab='';
  snaps.forEach((s,i)=>{
    if(i%step===0 || i===n-1)
      xlab += `<text x="${x(i).toFixed(1)}" y="${H-14}" fill="#8b949e" font-size="9" text-anchor="middle">${s.d.slice(5)}</text>`;
  });
  const dots = n<=40 ? pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${snaps[i].st==='强势'?'#f85149':snaps[i].st==='弱势'?'#3fb950':'#d29922'}"/>`).join('') : '';
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${bg}${grid}
    <path d="${area}" fill="#58a6ff" opacity="0.13"/>
    <path d="${line}" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linejoin="round"/>
    ${dots}${xlab}
  </svg>`;
  $('#charttip').textContent = `${snaps[0].d} ~ ${snaps[snaps.length-1].d}`;
}

/* ============ Tab 内容 ============ */
function rangeSnaps(){
  return DATES.filter(d=>d>=CUR.start && d<=CUR.end).map(d=>cache[d]).filter(Boolean);
}

function drawTab(){
  const snaps = rangeSnaps();
  if(!snaps.length){ $('#tabbody').innerHTML='<div class="empty">该区间没有数据</div>'; return; }
  if(TAB==='daily') drawDaily(snaps);
  else if(TAB==='rank') drawRank(snaps);
  else if(TAB==='pace') drawPace(snaps);
  else drawFlip(snaps);
}

function drawDaily(snaps){
  const rows = [...snaps].reverse().map(s=>{
    const holds = s.items.filter(x=>x.pass).slice(0,2);
    const holdTxt = holds.length
      ? holds.map(x=>`<span class="hold">${x.n}</span><span class="mini"> ${x.t.toFixed(1)}</span>`).join('　')
      : '<span class="mini">空仓</span>';
    const lead = s.items[0];
    const open = OPEN.has(s.d);
    let html = `<tr class="dr ${open?'open':''}" data-d="${s.d}">
      <td class="l"><span class="arw">▶</span> ${s.d} <span class="mini">${wd(s.d)}</span></td>
      <td>${stTag(s.st)}</td>
      <td>${s.w}%</td>
      <td>${holdTxt}</td>
      <td>${s.pass}<span class="mini">/${s.n}</span></td>
      <td class="l"><span class="mini">${lead?lead.n+' '+lead.t.toFixed(1)+(lead.pass?'':' ⚠未过风控'):'—'}</span></td>
      <td class="${cls(s.idx_chg)}">${sgn(s.idx_chg)}</td>
    </tr>`;
    if(open) html += `<tr class="sub"><td colspan="7">${detailTable(s)}</td></tr>`;
    return html;
  }).join('');

  $('#tabbody').innerHTML = `<div class="tw"><table>
    <thead><tr>
      <th class="l">日期</th><th>大盘</th><th>建议仓位</th><th>当日推荐（前2且过风控）</th>
      <th>通过数</th><th class="l">榜首（仅按总分）</th><th>上证</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mini" style="padding:10px 4px 2px">💡 点任意一行展开当日 48 只 ETF 完整因子明细</div>`;

  $('#tabbody').querySelectorAll('tr.dr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const d = tr.dataset.d;
      if(OPEN.has(d)) OPEN.delete(d); else OPEN.add(d);
      drawDaily(rangeSnaps());
    });
  });
}

function detailTable(s){
  const rows = s.items.map(x=>`<tr>
    <td class="l"><span class="rk ${x.r<=3?'r'+(x.r):''}">${x.r}</span></td>
    <td class="l">${x.n}</td><td class="mini">${x.c}</td>
    <td>${fmt(x.p,3)}</td>
    <td class="${cls(x.dc)}">${sgn(x.dc)}</td>
    <td class="${cls(x.t5)}">${sgn(x.t5)}</td>
    <td class="${cls(x.t10)}">${sgn(x.t10)}</td>
    <td class="${cls(x.m)}">${fmt(x.m,1)}</td>
    <td>${fmt(x.vp,0)}%</td><td>${fmt(x.vs,1)}</td>
    <td>${fmt(x.fr,2)}</td><td>${fmt(x.fs,1)}</td>
    <td><b>${fmt(x.t,2)}</b></td>
    <td>${x.pass?'<span class="tag ok">通过</span>':'<span class="tag no">未过</span>'}</td>
  </tr>`).join('');
  return `<div class="subbox">

function drawRank(snaps){
  const agg = {};
  snaps.forEach(s=>{
    const holds = s.items.filter(x=>x.pass).slice(0,2).map(x=>x.c);
    s.items.forEach(x=>{
      const a = agg[x.c] || (agg[x.c] = {n:x.n, c:x.c, st:0, sn:0, sp:0, top5:0, hold:0, first:null, last:null, pass:0, best:99});
      a.st += x.t; a.sn++; a.sp += x.r;
      if(x.r<=5) a.top5++;
      if(holds.includes(x.c)) a.hold++;
      if(x.pass) a.pass++;
      if(x.r < a.best) a.best = x.r;
      if(a.first==null) a.first = x.p;
      a.last = x.p;
    });
  });
  const list = Object.values(agg).map(a=>({
    ...a, avg:a.st/a.sn, ar:a.sp/a.sn,
    ret: (a.first && a.last) ? (a.last/a.first-1)*100 : null,
    inRate: a.sn/snaps.length*100
  })).sort((x,y)=>y.avg-x.avg);

  const rows = list.map((a,i)=>`<tr>
    <td class="l"><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td>
    <td class="l">${a.n}</td>
    <td><b>${fmt(a.avg,2)}</b></td>

    <td>${a.pass}<span class="mini">/${a.sn}</span></td>
    <td>${a.best}</td>
    <td><span class="bar"><i style="width:${Math.min(100,a.inRate).toFixed(0)}%"></i></span> <span class="mini">${a.sn}日</span></td>
  </tr>`).join('');

  $('#tabbody').innerHTML = `<div class="mini" style="padding:2px 4px 8px">

function drawFlip(snaps){
  // 推荐(前2且过风控)的切换轨迹 —— 精确算出 换出/换入/保留
  const NM = {};
  snaps.forEach(s=>s.items.forEach(x=>NM[x.c]=x.n));
  let prev = null;                 // 上一个推荐组合的 code 数组(null=区间开始)
  const rows = [];
  snaps.forEach(s=>{
    const holds = s.items.filter(x=>x.pass).slice(0,2);
    const codes = holds.map(x=>x.c).sort();
    const key = codes.join(',');
    const lastRow = rows[rows.length-1];
    if (lastRow && lastRow.key === key){        // 组合没变, 只延长持续
      lastRow.until = s.d; lastRow.len++;
      return;
    }
    const out  = prev ? prev.filter(c=>!codes.includes(c)) : [];
    const inn  = prev ? codes.filter(c=>!prev.includes(c)) : codes.slice();
    const keep = prev ? codes.filter(c=>prev.includes(c)) : [];
    rows.push({d:s.d, st:s.st, w:s.w, holds, key, out, inn, keep,
               until:s.d, len:1, first: prev===null});
    prev = codes;
  });
  if(!rows.length){ $('#tabbody').innerHTML='<div class="empty">无推荐切换</div>'; return; }

  const nm = c => NM[c] || c;
  const html = rows.map(r=>{
    // "本次操作"列
    let act = '';
    if (r.first){
      act = r.holds.length
        ? `<span class="act buy">买入</span> ${r.holds.map(h=>h.n).join(' + ')} <span class="mini">（建仓）</span>`
        : `<span class="mini">区间起点即空仓</span>`;
    } else if (!r.holds.length){
      act = r.out.length ? `<span class="act sell">卖出</span> ${r.out.map(nm).join(' + ')} <span class="mini">（转为空仓）</span>` : '<span class="mini">—</span>';
    } else {
      const parts = [];
      if (r.out.length)  parts.push(`<span class="act sell">卖出</span> ${r.out.map(nm).join(' + ')}`);
      if (r.inn.length)  parts.push(`<span class="act buy">买入</span> ${r.inn.map(nm).join(' + ')}`);
      if (r.keep.length) parts.push(`<span class="mini">继续持有 ${r.keep.map(nm).join(' + ')}</span>`);
      act = parts.join('<br>') || '<span class="mini">—</span>';
    }
    const dur = r.len > 1
      ? `持有 ${r.len} 个交易日<br><span class="mini">${r.d} → ${r.until}</span>`
      : `<span class="mini">仅 1 日</span>`;
    return `<tr>
      <td class="l">${r.d} <span class="mini">${wd(r.d)}</span></td>
      <td>${stTag(r.st)}</td>
      <td>${r.w}%</td>
      <td class="l">${r.holds.length?`<span class="hold">${r.holds.map(h=>h.n+' '+h.t.toFixed(1)).join(' · ')}</span>`:'<span class="mini">空仓</span>'}</td>
      <td class="l">${act}</td>
      <td class="l">${dur}</td>
    </tr>`;
  }).join('');

  // 换手统计
  const flips = rows.length - 1;
  const avgHold = (snaps.length / Math.max(rows.length,1));
  const maxHold = Math.max(...rows.map(r=>r.len));
  const emptyDays = snaps.filter(s=>!s.items.filter(x=>x.pass).length).length;

  $('#tabbody').innerHTML = `
    <div class="note">
      <b>怎么读这张表</b>：这里记录的是「每日信号推荐」，不是你的真实持仓。<br>
      当天综合得分 <b>前2名且三重风控通过</b> 的 ETF = 当日推荐；若前2名都没过风控则为空仓。<br>
      <b>卖出</b> = 昨天在推荐里、今天掉出去了（按信号该卖）　<b>买入</b> = 今天新进入推荐（按信号该买）　<b>继续持有</b> = 两天都在名单里，不用动。
    </div>
    <div class="cards" style="margin:12px 0">
      <div class="kpi"><div class="k">区间换手次数</div><div class="v">${flips}<span class="mini"> 次</span></div><div class="x">推荐组合变化</div></div>
      <div class="kpi"><div class="k">平均持有</div><div class="v">${fmt(avgHold,1)}<span class="mini"> 日</span></div><div class="x">${snaps.length} 交易日 / ${rows.length} 段</div></div>
      <div class="kpi"><div class="k">最长持有</div><div class="v">${maxHold}<span class="mini"> 日</span></div><div class="x">单个组合连续在榜</div></div>
      <div class="kpi"><div class="k">空仓天数</div><div class="v">${emptyDays}<span class="mini"> 日</span></div><div class="x">前2名均未过风控</div></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th class="l">日期</th><th>大盘</th><th>建议仓位</th><th class="l">当日推荐</th><th class="l">本次操作（按信号）</th><th class="l">持续</th></tr></thead>
      <tbody>${html}</tbody></table></div>

/* ============ 调仓节奏对比：同样信号，不同换手频率，谁的净值更好 ============ */
let COST_RATE = 0.05;     // 单边交易成本 %（佣金+滑点），可调

const PACE_MODES = [
  {k:'daily',  name:'严格每日', color:'#58a6ff', desc:'信号一变就换（当前默认口径）'},
  {k:'min3',   name:'最少持有3日', color:'#d29922', desc:'不满3天不动，满3天后信号变才换'},
  {k:'min5',   name:'最少持有5日', color:'#a371f7', desc:'不满5天不动'},
  {k:'min10',  name:'最少持有10日', color:'#3fb950', desc:'不满10天不动'},
  {k:'weekly', name:'每周一次', color:'#f0883e', desc:'每周首个交易日按信号调仓'},
];

function weekKey(d){
  const t = new Date(d + 'T00:00:00');
  const wd = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - wd);
  return t.toISOString().slice(0, 10);
}
const isWeekFirst = (snaps, i) => i === 0 || weekKey(snaps[i].d) !== weekKey(snaps[i-1].d);

function simulate(snaps, mode, costRate){
  const N = snaps.length;
  let nav = 1, peak = 1, mdd = 0, costSum = 0;
  let holds = [], lastReb = 0, rebIdx = [], holdLens = [];
  const curve = [];

  for (let i = 0; i < N; i++){
    const s = snaps[i];
    const w = (s.w || 0) / 100;                      // 建议总仓位
    // ① 先按昨日收盘后的持仓，吃今日涨跌
    if (holds.length){
      let sum = 0;
      holds.forEach(c=>{
        const it = s.items.find(x=>x.c===c);
        sum += it ? it.dc/100 : 0;
      });
      nav *= 1 + (sum/holds.length) * w;
    }
    // ② 收盘后按规则决定是否调仓
    const target = s.items.filter(x=>x.pass).slice(0,2).map(x=>x.c);
    const same = holds.length === target.length && holds.every(c=>target.includes(c));
    let reb = false;
    if (i === 0) reb = !same;
    else if (mode === 'daily') reb = true;
    else if (mode === 'weekly') reb = isWeekFirst(snaps, i);
    else reb = ((i - lastReb) >= Number(mode.slice(3))) && !same;

    if (reb && !same){
      const outN = holds.filter(c=>!target.includes(c)).length;
      const inN  = target.filter(c=>!holds.includes(c)).length;
      const unit = w / Math.max(target.length, 1);
      const c = (outN + inN) * unit * (costRate/100);
      nav *= (1 - c); costSum += c;
      if (rebIdx.length) holdLens.push(i - rebIdx[rebIdx.length-1]);
      rebIdx.push(i);
      lastReb = i;
      holds = target;
    }
    if (nav > peak) peak = nav;
    const dd = (nav/peak - 1) * 100;
    if (dd < mdd) mdd = dd;
    curve.push(nav);
  }
  if (rebIdx.length) holdLens.push(N - rebIdx[rebIdx.length-1]);
  const avgHold = holdLens.length ? holdLens.reduce((a,b)=>a+b,0)/holdLens.length : 0;
  return {nav, ret:(nav-1)*100, mdd, flips:rebIdx.length, avgHold, cost:costSum*100, curve};
}

function paceChart(snaps, results){
  const W=1120, H=230, PL=44, PR=14, PT=16, PB=34;
  const iw=W-PL-PR, ih=H-PT-PB, n=snaps.length;
  const all=[];
  results.forEach(r=>all.push(...r.curve));
  const lo=Math.min(...all, 1), hi=Math.max(...all, 1);
  const pad=(hi-lo)*0.12 || 0.02;
  const y0=lo-pad, y1=hi+pad;
  const X=i=> n===1 ? PL+iw/2 : PL+iw*i/(n-1);
  const Y=v=> PT + ih*(1-(v-y0)/(y1-y0));

  let grid='';
  for(let k=0;k<=4;k++){
    const v=y0+(y1-y0)*k/4;
    grid+=`<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="#30363d" stroke-width="1" stroke-dasharray="3,4"/>
      <text x="${PL-6}" y="${(Y(v)+3.5).toFixed(1)}" fill="#8b949e" font-size="9" text-anchor="end">${v.toFixed(3)}</text>`;
  }
  // 净值1.0基准线
  grid+=`<line x1="${PL}" y1="${Y(1).toFixed(1)}" x2="${W-PR}" y2="${Y(1).toFixed(1)}" stroke="#6e7681" stroke-width="1"/>`;

  let lines='', legend='';
  results.forEach((r,idx)=>{
    const m = PACE_MODES.find(x=>x.k===r.k);
    const d = r.curve.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    lines+=`<path d="${d}" fill="none" stroke="${m.color}" stroke-width="2" stroke-linejoin="round" opacity="0.95"/>`;
    legend+=`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:11.5px;color:#c9d1d9">
      <i style="width:14px;height:3px;background:${m.color};display:inline-block;border-radius:2px"></i>${m.name} <b style="color:${r.ret>=0?'#f85149':'#3fb950'}">${r.ret>=0?'+':''}${r.ret.toFixed(1)}%</b></span>`;
  });
  const step=Math.max(1,Math.ceil(n/8));
  let xlab='';
  snaps.forEach((s,i)=>{ if(i%step===0||i===n-1)
    xlab+=`<text x="${X(i).toFixed(1)}" y="${H-14}" fill="#8b949e" font-size="9" text-anchor="middle">${s.d.slice(5)}</text>`;});

  return `<div class="chartbox"><div class="ct"><span>净值曲线（起点 1.000，含交易成本）</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${lines}${xlab}</svg>
    <div style="padding:8px 10px 4px;text-align:center">${legend}</div></div>`;
}

function drawPace(snaps){
  const results = PACE_MODES.map(m=>Object.assign(simulate(snaps, m.k, COST_RATE), {k:m.k}));
  const best = results.reduce((a,b)=> b.ret>a.ret ? b : a, results[0]);
  const worstCost = results.reduce((a,b)=> b.cost>a.cost ? b : a, results[0]);

  const rows = results.map(r=>{
    const m = PACE_MODES.find(x=>x.k===r.k);
    const isBest = r.k===best.k;
    return `<tr>
      <td class="l">${isBest?'🏆 ':''}<b>${m.name}</b><br><span class="mini">${m.desc}</span></td>
      <td>${r.flips}<span class="mini"> 次</span></td>
      <td>${fmt(r.avgHold,1)}<span class="mini"> 日</span></td>
      <td class="${cls(r.ret)}"><b>${sgn(r.ret)}</b></td>
      <td class="down">${fmt(r.mdd,2)}%</td>
      <td>${fmt(r.cost,2)}%</td>
      <td>${fmt(r.nav,4)}</td>
    </tr>`;
  }).join('');

  $('#tabbody').innerHTML = `
    <div class="note">
      <b>为什么做这个</b>：信号每天重算，但<b>不用每天换</b>。这里用同一批历史数据，套不同调仓节奏跑一遍，
      看<b>多换几次到底赚没赚到钱</b>。<br>
      算法：按当日建议仓位持股（前2名且过风控，等权），每日吃涨跌，按规则决定是否调仓，每次换仓扣一次成本。
      <div style="margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>单边交易成本</span>
        <input id="costIn" type="number" step="0.01" min="0" max="1" value="${COST_RATE}" style="width:78px;padding:5px 8px">
        <span>%（佣金+滑点，改成 0.1 试试）</span>
      </div>
    </div>
    <div class="cards" style="margin:12px 0">
      <div class="kpi"><div class="k">换手最省</div><div class="v" style="font-size:15px">${PACE_MODES.find(x=>x.k===results.reduce((a,b)=>b.flips<a.flips?b:a,results[0]).k).name}</div><div class="x">${results.reduce((a,b)=>b.flips<a.flips?b:a,results[0]).flips} 次调仓</div></div>
      <div class="kpi"><div class="k">收益最高</div><div class="v" style="font-size:15px">${PACE_MODES.find(x=>x.k===best.k).name}</div><div class="x">${sgn(best.ret)} · 回撤 ${fmt(best.mdd,1)}%</div></div>
      <div class="kpi"><div class="k">最多成本</div><div class="v" style="font-size:15px">${PACE_MODES.find(x=>x.k===worstCost.k).name}</div><div class="x">累计吃掉 ${fmt(worstCost.cost,2)}%</div></div>
      <div class="kpi"><div class="k">区间</div><div class="v" style="font-size:15px">${snaps.length} 交易日</div><div class="x">${CUR.start} ~ ${CUR.end}</div></div>
    </div>
    ${paceChart(snaps, results)}
    <div class="tw"><table>
      <thead><tr><th class="l">调仓节奏</th><th>调仓次数</th><th>平均持有</th><th>区间收益</th><th>最大回撤</th><th>累计成本</th><th>最终净值</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="mini" style="padding:10px 4px 2px">
      ⚠️ 这是简化模拟：不含个股止损/网格，不含分红除权，按收盘价成交，只用来比"换手频率"的影响；真实收益会有偏差。
    </div>`;

  const inp = $('#costIn');
  if (inp) inp.addEventListener('change', ()=>{
    const v = parseFloat(inp.value);
    COST_RATE = isNaN(v) || v < 0 ? 0 : Math.min(v, 1);
    drawPace(rangeSnaps());
  });
}
